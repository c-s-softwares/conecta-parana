<div class="flex flex-col gap-5">
  <app-page-header title="Eventos" buttonLabel="Novo evento" (create)="onCreate()" />

  <div class="toolbar">
    <div class="input-wrap" style="flex: 1; min-width: 240px">
      <ng-icon class="ic" name="heroMagnifyingGlass" size="18" />
      <input
        class="input"
        type="search"
        placeholder="Buscar eventos..."
        [value]="search()"
        (input)="onSearch($any($event.target).value)"
      />
    </div>

    <div class="tabs" role="tablist" aria-label="Filtrar por status">
      <button
        type="button"
        class="tab"
        [class.active]="statusFilter() === 'all'"
        (click)="setStatus('all')"
      >
        Todos
      </button>
      <button
        type="button"
        class="tab"
        [class.active]="statusFilter() === 'active'"
        (click)="setStatus('active')"
      >
        Ativos
      </button>
      <button
        type="button"
        class="tab"
        [class.active]="statusFilter() === 'inactive'"
        (click)="setStatus('inactive')"
      >
        Inativos
      </button>
    </div>

    <button
      type="button"
      class="btn btn-ghost btn-sm"
      (click)="toggleOrder()"
      [attr.aria-label]="
        order() === 'date_asc'
          ? 'Ordenar por data, crescente'
          : 'Ordenar por data, decrescente'
      "
    >
      <ng-icon name="heroArrowsUpDown" size="16" />
      {{ order() === 'date_asc' ? 'Data crescente' : 'Data decrescente' }}
    </button>
  </div>

  <app-data-list
    [items]="items()"
    [total]="total()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    emptyTitle="Nenhum evento encontrado"
    emptyDescription="Crie o primeiro evento ou ajuste os filtros."
    emptyIcon="heroCalendarDays"
    (pageChange)="onPage($event)"
  >
    <ng-template #row let-event>
      <div class="list-item">
        <div class="thumb">
          @if (event.photos.length && event.photos[0].thumbUrl) {
            <img
              [src]="event.photos[0].thumbUrl"
              alt=""
              style="width: 100%; height: 100%; object-fit: cover; border-radius: inherit"
            />
          } @else {
            <ng-icon name="heroCalendarDays" size="24" />
          }
        </div>
        <div class="body">
          <div class="title-row">
            <span class="title">{{ event.title }}</span>
            <span class="badge badge-evento">{{ event.type }}</span>
            <span
              class="badge badge-dot"
              [class.badge-ativo]="event.isActive"
              [class.badge-inativo]="!event.isActive"
            >
              {{ event.isActive ? 'Ativo' : 'Inativo' }}
            </span>
          </div>
          <div class="meta">
            <span>
              <ng-icon name="heroCalendarDays" size="13" />
              {{ event.eventDate | date: 'dd/MM/yyyy HH:mm' }}
            </span>
          </div>
        </div>
        <div class="actions">
          <button
            type="button"
            class="btn-icon"
            (click)="onEdit(event)"
            aria-label="Editar"
          >
            <ng-icon name="heroPencilSquare" size="16" />
          </button>
          <button
            type="button"
            class="btn-icon danger"
            (click)="askDelete(event)"
            aria-label="Excluir"
          >
            <ng-icon name="heroTrash" size="16" />
          </button>
        </div>
      </div>
    </ng-template>
  </app-data-list>

  <app-confirm-dialog
    [visible]="pendingDelete() !== null"
    [message]="
      'Excluir o evento ' +
      (pendingDelete()?.title ?? '') +
      '? Esta ação não pode ser desfeita.'
    "
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
