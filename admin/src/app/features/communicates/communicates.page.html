<header class="communicates-top">
  <div>
    <h1>Comunicados</h1>
    <p>Avisos oficiais da prefeitura: mudanças de horário, campanhas, prazos e orientações.</p>
  </div>

  <div class="top-actions">
    <div class="search-box">
      <ng-icon name="heroMagnifyingGlass" size="16" aria-hidden="true"> </ng-icon>
      <input
        type="search"
        placeholder="Buscar em comunicados..."
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        (keyup.enter)="applyFilters()"
      />
    </div>

    <button type="button" class="btn-filter" (click)="applyFilters()">
      <ng-icon name="heroFunnel" size="16" aria-hidden="true" />
      Filtros
    </button>

    <button type="button" class="btn-new" (click)="openCreate()">
      <ng-icon name="heroPlus" size="16" aria-hidden="true" />
      Novo comunicado
    </button>
  </div>
</header>

<section class="tabs-row">
  <div class="tabs">
    <button type="button" class="tab" [class.active]="isActive() === ''" (click)="clearFilters()">
      Todos <span>{{ total() }}</span>
    </button>

    <button
      type="button"
      class="tab"
      [class.active]="isActive() === 'true'"
      (click)="isActive.set('true'); applyFilters()"
    >
      Publicados
    </button>

    <button
      type="button"
      class="tab"
      [class.active]="isActive() === 'false'"
      (click)="isActive.set('false'); applyFilters()"
    >
      Rascunhos
    </button>
  </div>

  <span class="results-count">{{ total() }} resultados</span>
</section>

<app-data-list
  [items]="items()"
  [total]="total()"
  [page]="page()"
  [pageSize]="pageSize()"
  [loading]="loading()"
  emptyTitle="Nenhum comunicado encontrado"
  emptyDescription="Ajuste os filtros ou crie um novo comunicado."
  emptyIcon="heroMegaphone"
  (pageChange)="onPageChange($event)"
>
  <ng-template #row let-item let-index="index">
    <article class="communicate-row">
      <div class="communicate-icon" [class.alt]="index % 2 === 1">
        <ng-icon name="heroDocumentText" size="20" aria-hidden="true" />
      </div>

      <div class="communicate-content">
        <div class="communicate-title-line">
          <h2>{{ item.title }}</h2>

          <span class="priority-badge"> MÉDIA </span>

          <span class="status-badge" [class.inactive]="!item.isActive">
            {{ item.isActive ? 'PUBLICADO' : 'RASCUNHO' }}
          </span>
        </div>

        <p>{{ item.description }}</p>

        <div class="meta-row">
          <span>
            <ng-icon name="heroMapPin" size="13" aria-hidden="true" />
            Cidade
          </span>

          <span>
            <ng-icon name="heroCalendarDays" size="13" aria-hidden="true" />
            Hoje
          </span>

          <span>
            <ng-icon name="heroEye" size="13" aria-hidden="true" />
            0 visualizações
          </span>
        </div>
      </div>

      <div class="row-actions">
        <button
          type="button"
          class="icon-action"
          title="Editar"
          aria-label="Editar"
          (click)="openEdit(item)"
        >
          <ng-icon name="heroPencilSquare" size="17" aria-hidden="true" />
        </button>

        <button
          type="button"
          class="icon-action danger"
          title="Excluir"
          aria-label="Excluir"
          [disabled]="deletingId() === item.id"
          (click)="delete(item)"
        >
          <ng-icon name="heroTrash" size="17" aria-hidden="true" />
        </button>
      </div>
    </article>
  </ng-template>
</app-data-list>

<app-modal-dialog
  [visible]="modalOpen()"
  [title]="modalTitle()"
  subtitle="Preencha os dados do comunicado."
  size="l"
  [footer]="true"
  (cancelled)="closeModal()"
>
  <form class="modal-form" (ngSubmit)="save()">
    <app-form-field
      label="Título"
      fieldId="title"
      [required]="true"
      [showError]="submitted() && !!titleError()"
      [errorMessage]="titleError()"
    >
      <input
        id="title"
        class="input"
        type="text"
        maxlength="200"
        placeholder="Digite o título do comunicado"
        [ngModel]="form().title"
        name="title"
        (ngModelChange)="updateForm('title', $event)"
      />
    </app-form-field>

    <app-form-field
      label="Descrição"
      fieldId="description"
      [required]="true"
      [showError]="submitted() && !!descriptionError()"
      [errorMessage]="descriptionError()"
    >
      <textarea
        id="description"
        class="input textarea"
        rows="6"
        placeholder="Descreva o comunicado..."
        [ngModel]="form().description"
        name="description"
        (ngModelChange)="updateForm('description', $event)"
      ></textarea>
    </app-form-field>

    <label class="checkbox-row">
      <input
        type="checkbox"
        [ngModel]="form().isActive"
        name="isActive"
        (ngModelChange)="updateForm('isActive', $event)"
      />
      <span>Publicado</span>
    </label>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn-secondary" [disabled]="saving()" (click)="closeModal()">
      Cancelar
    </button>

    <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="save()">
      {{ saving() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</app-modal-dialog>
