<div class="flex flex-col gap-5">
  <header class="page-header">
    <div>
      <h1 class="h1">Comunicados</h1>
      <p class="lead">
        Avisos oficiais da prefeitura: mudanças de horário, campanhas, prazos e orientações.
      </p>
    </div>

    <div class="toolbar">
      <div class="input-wrap" style="width: 280px">
        <ng-icon class="ic" name="heroMagnifyingGlass" size="18" />
        <input
          class="input"
          type="search"
          placeholder="Buscar em comunicados..."
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
          (keyup.enter)="applyFilters()"
        />
      </div>

      <button type="button" class="btn btn-primary" (click)="openCreate()">
        <ng-icon name="heroPlus" size="16" />
        Novo comunicado
      </button>
    </div>
  </header>

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="tabs" role="tablist" aria-label="Filtrar por status">
      <button type="button" class="tab" [class.active]="isActive() === ''" (click)="clearFilters()">
        Todos
      </button>

      <button
        type="button"
        class="tab"
        [class.active]="isActive() === 'true'"
        (click)="isActive.set('true'); applyFilters()"
      >
        Publicados
      </button>

      <button
        type="button"
        class="tab"
        [class.active]="isActive() === 'false'"
        (click)="isActive.set('false'); applyFilters()"
      >
        Rascunhos
      </button>
    </div>

    <span class="text-sm text-[var(--text-subtle)]">
      {{ total() }} resultado{{ total() === 1 ? '' : 's' }}
    </span>
  </div>

  <app-data-list
    [items]="items()"
    [total]="total()"
    [page]="page()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    emptyTitle="Nenhum comunicado encontrado"
    emptyDescription="Crie o primeiro comunicado ou ajuste os filtros."
    emptyIcon="heroMegaphone"
    (pageChange)="onPageChange($event)"
  >
    <ng-template #row let-item>
      <div class="list-item">
        <div
          class="thumb"
          style="background: oklch(0.95 0.05 195 / 0.55); color: oklch(0.45 0.13 195)"
        >
          <ng-icon name="heroMegaphone" size="26" />
        </div>

        <div class="body">
          <div class="title-row">
            <span class="title">{{ item.title }}</span>
            <span
              class="badge badge-dot"
              [class.badge-ativo]="item.isActive"
              [class.badge-inativo]="!item.isActive"
            >
              {{ item.isActive ? 'Publicado' : 'Rascunho' }}
            </span>
          </div>

          <p class="desc">{{ item.description }}</p>
        </div>

        <div class="actions">
          <button type="button" class="btn-icon" (click)="openEdit(item)" aria-label="Editar">
            <ng-icon name="heroPencilSquare" size="16" />
          </button>

          <button
            type="button"
            class="btn-icon danger"
            [disabled]="deletingId() === item.id"
            (click)="delete(item)"
            aria-label="Excluir"
          >
            <ng-icon name="heroTrash" size="16" />
          </button>
        </div>
      </div>
    </ng-template>
  </app-data-list>

  <app-modal-dialog
    [visible]="modalOpen()"
    [title]="modalTitle()"
    subtitle="Preencha os campos abaixo para publicar."
    size="l"
    [footer]="true"
    (cancelled)="closeModal()"
  >
    <form class="modal-form" (ngSubmit)="saveAs(true)">
      <app-form-field
        label="Título"
        fieldId="title"
        [required]="true"
        [showError]="submitted() && !!titleError()"
        [errorMessage]="titleError()"
      >
        <input
          id="title"
          class="input"
          type="text"
          maxlength="200"
          placeholder="Título do comunicado"
          [ngModel]="form().title"
          name="title"
          (ngModelChange)="updateForm('title', $event)"
        />
      </app-form-field>

      <app-form-field
        label="Conteúdo"
        fieldId="description"
        [required]="true"
        [showError]="submitted() && !!descriptionError()"
        [errorMessage]="descriptionError()"
      >
        <textarea
          id="description"
          class="input textarea"
          rows="5"
          placeholder="Escreva aqui..."
          [ngModel]="form().description"
          name="description"
          (ngModelChange)="updateForm('description', $event)"
        ></textarea>
      </app-form-field>
      <div class="cover-upload">
        <span class="cover-label">Imagem de capa</span>

        <label class="cover-box">
          <input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            class="sr-only"
            (change)="onFileSelected($event)"
          />

          @if (previewUrl()) {
            <img [src]="previewUrl()" alt="" class="cover-preview" />
          } @else {
            <span class="cover-icon">
              <ng-icon name="heroPhoto" size="20"></ng-icon>
            </span>

            <strong>Arraste uma imagem ou clique para enviar</strong>
            <small>PNG, JPG até 5MB · Recomendado 1600x900</small>
          }
        </label>

        @if (previewUrl()) {
          <button type="button" class="btn btn-ghost btn-sm" (click)="removeSelectedFile()">
            Remover imagem
          </button>
        }
      </div>
    </form>

    <div modal-footer>
      <button type="button" class="btn btn-secondary" [disabled]="saving()" (click)="closeModal()">
        Cancelar
      </button>

      <button type="button" class="btn btn-secondary" [disabled]="saving()" (click)="saveAs(false)">
        Salvar rascunho
      </button>

      <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="saveAs(true)">
        <ng-icon name="heroCheck" size="16" />
        Publicar
      </button>
    </div>
  </app-modal-dialog>
</div>
