<div>
  <label [for]="fieldId()" class="field-label">
    {{ label() }}
    @if (required()) {
      <span class="text-[var(--danger)]">*</span>
    }
  </label>

  @if (type() === 'file') {
    <button
      type="button"
      class="dropzone"
      (click)="fileInput.click()"
      (dragover)="onDragOver($event)"
      (drop)="onDrop($event)"
      [attr.aria-describedby]="showError() && errorMessage() ? fieldId() + '-error' : null"
    >
      <span class="ic-bubble bubble-brand" style="width: 44px; height: 44px; margin-bottom: 0">
        <ng-icon name="heroCloudArrowUp" size="20" aria-hidden="true" />
      </span>
      <span class="dropzone-title">Arraste ou clique para adicionar arquivos</span>
      @if (hint()) {
        <span class="dropzone-hint">{{ hint() }}</span>
      }
    </button>
    <input
      #fileInput
      [id]="fieldId()"
      type="file"
      [accept]="accept()"
      [multiple]="multiple()"
      class="hidden"
      (change)="onFilesSelected($event)"
    />

    @if (selectedFiles().length > 0) {
      <ul class="mt-2 flex flex-col gap-1.5" aria-label="Arquivos selecionados">
        @for (file of selectedFiles(); track file.name + $index) {
          <li class="file-chip">
            <span class="truncate">{{ file.name }}</span>
            <button
              type="button"
              class="btn-icon danger"
              style="width: 28px; height: 28px"
              (click)="removeFile($index)"
              aria-label="Remover arquivo"
            >
              <ng-icon name="heroXMark" size="14" aria-hidden="true" />
            </button>
          </li>
        }
      </ul>
    }
  } @else {
    <ng-content />
  }

  @if (showError()) {
    <p class="field-error" [id]="fieldId() + '-error'">{{ errorMessage() }}</p>
  }
</div>
