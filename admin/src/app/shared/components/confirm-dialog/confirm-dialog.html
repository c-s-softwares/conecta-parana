<!-- eslint-disable @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
@if (visible()) {
  <div class="modal-backdrop" (click)="cancelled.emit()">
    <div
      class="modal modal-s"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      (click)="$event.stopPropagation()"
    >
      <div class="flex flex-col items-start gap-4 p-7 pb-0">
        <span
          class="ic-bubble"
          style="width: 52px; height: 52px; border-radius: 14px; margin-bottom: 0; background: var(--danger-bg); color: var(--danger)"
          aria-hidden="true"
        >
          <ng-icon name="heroExclamationTriangle" size="24" />
        </span>
        <div>
          <h2 id="confirm-title" class="text-xl font-bold text-[var(--n-900)]">{{ title() }}</h2>
          <p class="mt-2 text-sm leading-relaxed text-[var(--text-muted)]">{{ message() }}</p>
        </div>
      </div>

      <div class="flex justify-end gap-2.5 p-7 pt-5">
        <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancelar</button>
        <button type="button" [class]="confirmBtnClass()" (click)="confirmed.emit()">
          @if (confirmIcon()) {
            <ng-icon [name]="confirmIcon()" size="16" aria-hidden="true" />
          }
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
