<div class="flex flex-col items-center justify-center py-12 px-4 text-center" role="region" aria-label="Estado vazio">
  <div aria-hidden="true" class="mb-4 flex items-center justify-center">
    <ng-icon [name]="iconName()" size="48" class="text-gray-400" />
  </div>
  <h3 class="text-base font-semibold text-gray-700 dark:text-gray-300">{{ title() }}</h3>
  @if (description()) {
    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400 max-w-sm">{{ description() }}</p>
  }
</div>
