<aside class="flex h-screen w-60 flex-col bg-sidebar px-3 py-4">
  <nav class="flex flex-1 flex-col gap-2">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="ring-2 ring-white/50"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-2 rounded-lg bg-primary px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-dark"
      >
        <ng-icon [name]="item.icon" size="20" class="shrink-0" aria-hidden="true" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    (click)="logout.emit()"
    class="flex cursor-pointer items-center gap-2 rounded-lg bg-primary px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-dark"
  >
    <ng-icon name="heroArrowLeftOnRectangle" size="20" class="shrink-0" aria-hidden="true" />
    <span>Sair</span>
  </button>
</aside>
