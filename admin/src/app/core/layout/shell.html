@if (!isOnline()) {
  <div class="offline-banner">
    <ng-icon name="heroSignal" size="16" />
    <span>Sem conexão com o servidor</span>
  </div>
}

<div class="app">
  <app-sidebar [items]="visibleNavItems()" [user]="sidebarUser()" (logout)="onLogout()" />

  <main class="main">
    <router-outlet />
  </main>
</div>
