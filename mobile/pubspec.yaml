name: conectaparana
description: "Plataforma multi-cidade para o estado do Paraná"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  dio: ^5.0.0

  mocktail: ^1.0.3

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.3.0
  webview_flutter: ^4.0.0
  shared_preferences: ^2.2.2

  go_router: ^14.0.0
  app_links: ^6.0.0
  photo_view: ^0.15.0

  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  geolocator: ^14.0.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/paranalogo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/paranalogo.png"
